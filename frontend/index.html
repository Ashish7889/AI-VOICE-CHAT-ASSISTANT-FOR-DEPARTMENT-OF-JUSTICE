<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#667eea" />
    <title>JARVIS - DoJ Virtual Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/ui/advanced-styles.css">
    <style>
      body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        margin: 0; 
        padding: 0; 
        background: #f7f7f7;
        transition: all 0.3s ease;
      }
      
      .container { 
        max-width: 900px; 
        margin: 0 auto; 
        padding: 16px; 
      }
      
      .card { 
        background: #fff; 
        border-radius: 12px; 
        padding: 20px; 
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        transition: all 0.3s ease;
        position: relative;
      }
      
      .card.voice-mode {
        background: linear-gradient(135deg, #0a1a2e 0%, #16213e 50%, #1a2332 100%);
        box-shadow: 0 0 30px rgba(0,212,255,0.3), 0 4px 20px rgba(0,0,0,0.3);
        border: 2px solid #00d4ff;
      }
      
      .header { 
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 2px solid #eee;
      }
      
      .voice-mode .header {
        border-bottom: 2px solid #00d4ff;
      }
      
      .title-section h2 {
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        transition: all 0.3s ease;
      }
      
      .controls {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      
      .messages { 
        height: 60vh; 
        overflow: auto; 
        border-radius: 12px; 
        padding: 12px; 
        transition: all 0.3s ease;
        scrollbar-width: thin;
        scrollbar-color: #00d4ff #333;
      }
      
      .messages::-webkit-scrollbar {
        width: 8px;
      }
      
      .messages::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.1);
      }
      
      .messages::-webkit-scrollbar-thumb {
        background: #00d4ff;
        border-radius: 4px;
      }
      
      .msg { 
        margin: 12px 0;
        padding: 8px;
        border-radius: 8px;
        transition: all 0.2s ease;
      }
      
      .voice-mode .msg {
        background: rgba(0,212,255,0.1);
        border-left: 3px solid #00d4ff;
      }
      
      .msg .who { 
        font-weight: 600; 
        margin-right: 12px;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      }
      
      .input { 
        display: flex; 
        gap: 10px; 
        margin-top: 16px;
        transition: all 0.3s ease;
      }
      
      textarea { 
        flex: 1; 
        resize: vertical; 
        min-height: 60px; 
        padding: 12px;
        border-radius: 8px;
        border: 2px solid #ddd;
        font-family: inherit;
        font-size: 14px;
        transition: all 0.3s ease;
      }
      
      textarea:focus {
        outline: none;
        border-color: #00d4ff;
        box-shadow: 0 0 10px rgba(0,212,255,0.3);
      }
      
      button { 
        padding: 10px 16px; 
        border: none; 
        border-radius: 8px; 
        background: #00428e; 
        color: #fff; 
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      
      button:hover:not([disabled]) {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(0,66,142,0.4);
      }
      
      button[disabled] { 
        opacity: 0.6; 
        cursor: not-allowed;
        transform: none;
      }
      
      select { 
        padding: 8px 12px;
        border-radius: 6px;
        border: 2px solid #ddd;
        background: white;
        cursor: pointer;
      }
      
      .voice-toggle {
        position: relative;
        overflow: hidden;
      }
      
      .voice-toggle:hover {
        transform: scale(1.05);
      }
      
      .voice-toggle.active {
        animation: pulse-glow 2s infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      
      @keyframes pulse-glow {
        0%, 100% { 
          box-shadow: 0 0 20px #ff4444;
          transform: scale(1);
        }
        50% { 
          box-shadow: 0 0 40px #ff4444, 0 0 60px #ff4444;
          transform: scale(1.02);
        }
      }
      
      @keyframes matrix-rain {
        0% { opacity: 0; transform: translateY(-20px); }
        50% { opacity: 1; }
        100% { opacity: 0; transform: translateY(20px); }
      }
      
      .voice-indicator {
        animation: pulse 2s infinite ease-in-out;
      }
      
      .status-indicator {
        font-family: 'Courier New', monospace;
        font-weight: bold;
        text-shadow: 0 0 5px currentColor;
      }
      
      /* Futuristic scrolling effect */
      .voice-mode .messages {
        background-attachment: fixed;
        position: relative;
      }
      
      .voice-mode .messages::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="%2300d4ff" stroke-width="0.5" opacity="0.3"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grid)"/></svg>') repeat;
        pointer-events: none;
        opacity: 0.1;
      }
      
      /* Responsive design */
      @media (max-width: 768px) {
        .header {
          flex-direction: column;
          gap: 10px;
        }
        
        .controls {
          flex-direction: column;
          gap: 10px;
        }
        
        .messages {
          height: 50vh;
        }
        
        .input {
          flex-direction: column;
        }
        
        textarea {
          min-height: 80px;
        }
      }
    </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div id="root"></div>
    </div>
    
    <!-- Loading Screen -->
    <div id="loading-screen" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    ">
      <div style="text-align: center; color: white;">
        <div style="font-size: 48px; margin-bottom: 20px;">🤖</div>
        <h2 style="margin: 0; font-family: Inter, sans-serif;">JARVIS Initializing...</h2>
        <div style="
          width: 200px;
          height: 4px;
          background: rgba(255,255,255,0.3);
          border-radius: 2px;
          margin: 20px auto;
          overflow: hidden;
        ">
          <div style="
            width: 50px;
            height: 100%;
            background: white;
            border-radius: 2px;
            animation: loading-bar 2s ease-in-out infinite;
          "></div>
        </div>
      </div>
    </div>
    
    <style>
      @keyframes loading-bar {
        0% { transform: translateX(-50px); }
        100% { transform: translateX(200px); }
      }
    </style>
    
    <script>
      // Hide loading screen after page loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.remove();
          }, 500);
        }, 2000);
      });
    </script>
    
    <!-- Load React and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React;
      
      // Enhanced Voice Assistant Component
      function EnhancedVoiceAssistant() {
        const [messages, setMessages] = useState([
          { 
            id: 1, 
            who: 'JARVIS', 
            text: 'नमस्कार! मैं JARVIS हूँ - आपका न्याय विभाग सहायक। आज मैं आपकी कैसे सहायता कर सकता हूँ?', 
            timestamp: new Date()
          }
        ]);
        
        const [input, setInput] = useState('');
        const [isProcessing, setIsProcessing] = useState(false);
        const [currentLanguage, setCurrentLanguage] = useState('hi-IN');
        const [voiceMode, setVoiceMode] = useState(false);
        const [isListening, setIsListening] = useState(false);
        const [isAwake, setIsAwake] = useState(false);
        const [sessionId] = useState(() => Math.random().toString(36).slice(2));
        const [connectionStatus, setConnectionStatus] = useState('connected');
        
        const recognitionRef = useRef(null);
        const continuousRecognitionRef = useRef(null);
        const messagesEndRef = useRef(null);
        const timeoutRef = useRef(null);
        
        // Indian Languages Configuration
        const indianLanguages = {
          'hi-IN': { 
            name: 'Hindi', 
            nativeName: 'हिन्दी',
            wakeWords: ['जार्विस', 'हे जार्विस', 'कंप्यूटर', 'सहायक'],
            greeting: 'नमस्कार! मैं आपकी कैसे सहायता कर सकता हूँ?'
          },
          'en-IN': { 
            name: 'English (India)', 
            nativeName: 'English',
            wakeWords: ['jarvis', 'hey jarvis', 'computer', 'assistant'],
            greeting: 'Hello! How can I assist you today?'
          },
          'bn-IN': { 
            name: 'Bengali', 
            nativeName: 'বাংলা',
            wakeWords: ['জার্ভিস', 'হে জার্ভিস', 'কম্পিউটার', 'সহায়ক'],
            greeting: 'নমস্কার! আমি আপনাকে কীভাবে সাহায্য করতে পারি?'
          },
          'ta-IN': { 
            name: 'Tamil', 
            nativeName: 'தமிழ்',
            wakeWords: ['ஜார்விஸ்', 'ஹே ஜார்விஸ்', 'கணினி', 'உதவியாளர்'],
            greeting: 'வணக்கம்! நான் உங்களுக்கு எப்படி உதவ முடியும்?'
          },
          'te-IN': { 
            name: 'Telugu', 
            nativeName: 'తెలుగు',
            wakeWords: ['జార్విస్', 'హే జార్విస్', 'కంప్యూటర్', 'సహాయకుడు'],
            greeting: 'నమస్కారం! నేను మీకు ఎలా సహాయం చేయగలను?'
          },
          'ml-IN': { 
            name: 'Malayalam', 
            nativeName: 'മലയാളം',
            wakeWords: ['ജാർവിസ്', 'ഹേ ജാർവിസ്', 'കമ്പ്യൂട്ടർ', 'സഹായി'],
            greeting: 'നമസ്കാരം! എനിക്ക് നിങ്ങളെ എങ്ങനെ സഹായിക്കാം?'
          },
          'mr-IN': { 
            name: 'Marathi', 
            nativeName: 'मराठी',
            wakeWords: ['जार्विस', 'हे जार्विस', 'संगणक', 'सहाय्यक'],
            greeting: 'नमस्कार! मी तुमची कशी मदत करू शकतो?'
          }
        };
        
        // Wake word detection
        const checkForWakeWord = useCallback((transcript) => {
          const currentLang = indianLanguages[currentLanguage];
          if (!currentLang) return false;
          
          const lowerTranscript = transcript.toLowerCase();
          return currentLang.wakeWords.some(word => 
            lowerTranscript.includes(word.toLowerCase())
          );
        }, [currentLanguage]);
        
        // Enhanced Speech Recognition Setup
        const setupSpeechRecognition = useCallback(() => {
          if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            addSystemMessage('Speech recognition not supported in this browser', 'error');
            return;
          }
          
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          
          // Command Recognition
          const commandRecognition = new SpeechRecognition();
          commandRecognition.lang = currentLanguage;
          commandRecognition.continuous = false;
          commandRecognition.interimResults = false;
          
          commandRecognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            console.log('Recognized:', transcript);
            
            setInput(transcript);
            setIsListening(false);
            processVoiceCommand(transcript);
          };
          
          commandRecognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            setIsListening(false);
            addSystemMessage('Speech recognition error: ' + event.error, 'error');
          };
          
          commandRecognition.onend = () => {
            setIsListening(false);
            if (voiceMode && !isAwake) {
              setTimeout(() => startContinuousListening(), 1000);
            }
          };
          
          recognitionRef.current = commandRecognition;
          
          // Continuous Wake Word Recognition
          if (voiceMode) {
            const wakeWordRecognition = new SpeechRecognition();
            wakeWordRecognition.lang = currentLanguage;
            wakeWordRecognition.continuous = true;
            wakeWordRecognition.interimResults = true;
            
            wakeWordRecognition.onresult = (event) => {
              for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                
                if (checkForWakeWord(transcript)) {
                  wakeWordRecognition.stop();
                  activateAssistant();
                  break;
                }
              }
            };
            
            wakeWordRecognition.onerror = (event) => {
              if (voiceMode && event.error !== 'aborted') {
                setTimeout(() => {
                  try {
                    wakeWordRecognition.start();
                  } catch (e) {
                    console.error('Failed to restart wake word recognition:', e);
                  }
                }, 2000);
              }
            };
            
            wakeWordRecognition.onend = () => {
              if (voiceMode && !isAwake) {
                setTimeout(() => {
                  try {
                    wakeWordRecognition.start();
                  } catch (e) {
                    console.error('Failed to restart wake word recognition:', e);
                  }
                }, 100);
              }
            };
            
            continuousRecognitionRef.current = wakeWordRecognition;
          }
        }, [currentLanguage, voiceMode, checkForWakeWord, isAwake]);
        
        // Text-to-Speech
        const speak = useCallback((text) => {
          return new Promise((resolve) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = currentLanguage;
              utterance.rate = 1.0;
              utterance.pitch = 0.9;
              
              const voices = window.speechSynthesis.getVoices();
              const preferredVoice = voices.find(voice => 
                voice.lang.startsWith(currentLanguage) ||
                voice.lang.startsWith(currentLanguage.split('-')[0])
              );
              
              if (preferredVoice) {
                utterance.voice = preferredVoice;
              }
              
              utterance.onend = resolve;
              utterance.onerror = resolve;
              
              window.speechSynthesis.speak(utterance);
            } else {
              resolve();
            }
          });
        }, [currentLanguage]);
        
        // System Message Helper
        const addSystemMessage = (message, type = 'info') => {
          const systemMessage = {
            id: Date.now(),
            who: 'System',
            text: message,
            timestamp: new Date(),
            type: type
          };
          setMessages(prev => [...prev, systemMessage]);
        };
        
        // Assistant Activation
        const activateAssistant = async () => {
          setIsAwake(true);
          setIsListening(true);
          
          const currentLang = indianLanguages[currentLanguage];
          addSystemMessage(`🟢 JARVIS Activated - ${currentLang.nativeName}`, 'success');
          
          await speak(currentLang.greeting);
          
          setTimeout(() => {
            if (recognitionRef.current && isAwake) {
              try {
                recognitionRef.current.start();
              } catch (error) {
                console.error('Failed to start command recognition:', error);
                setIsListening(false);
              }
            }
          }, 500);
          
          timeoutRef.current = setTimeout(() => {
            if (isAwake && !isProcessing) {
              deactivateAssistant('timeout');
            }
          }, 15000);
        };
        
        // Assistant Deactivation
        const deactivateAssistant = async (reason = 'manual') => {
          setIsAwake(false);
          setIsListening(false);
          setIsProcessing(false);
          
          if (timeoutRef.current) {
            clearTimeout(timeoutRef.current);
          }
          
          if (recognitionRef.current) {
            recognitionRef.current.stop();
          }
          
          addSystemMessage(`🔴 Returning to standby mode`, 'info');
          
          if (voiceMode) {
            setTimeout(() => startContinuousListening(), 2000);
          }
        };
        
        // Process Voice Commands
        const processVoiceCommand = async (command) => {
          setIsProcessing(true);
          clearTimeout(timeoutRef.current);
          
          const userMessage = {
            id: Date.now(),
            who: 'You',
            text: command,
            timestamp: new Date()
          };
          
          setMessages(prev => [...prev, userMessage]);
          
          try {
            const response = await fetch('/ask', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                query: command,
                session_id: sessionId,
                language: currentLanguage,
                voice_mode: true
              })
            });
            
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            const answer = data.answer || 'I apologize, but I could not process your request.';
            
            const assistantMessage = {
              id: Date.now() + 1,
              who: 'JARVIS',
              text: answer,
              timestamp: new Date(),
              sources: data.sources || []
            };
            
            setMessages(prev => [...prev, assistantMessage]);
            
            await speak(answer);
            
            setIsProcessing(false);
            
            setTimeout(() => {
              deactivateAssistant('completed');
            }, 1000);
            
          } catch (error) {
            console.error('Voice command processing error:', error);
            
            const errorMessage = 'I apologize, there was an error processing your request.';
            const assistantMessage = {
              id: Date.now() + 1,
              who: 'JARVIS',
              text: errorMessage,
              timestamp: new Date(),
              type: 'error'
            };
            
            setMessages(prev => [...prev, assistantMessage]);
            await speak(errorMessage);
            
            setIsProcessing(false);
            deactivateAssistant('completed');
          }
        };
        
        // Start Continuous Listening
        const startContinuousListening = useCallback(() => {
          if (continuousRecognitionRef.current && voiceMode) {
            try {
              continuousRecognitionRef.current.start();
              const currentLang = indianLanguages[currentLanguage];
              addSystemMessage(`🔴 Listening for wake words in ${currentLang.nativeName}`, 'info');
            } catch (error) {
              console.error('Failed to start continuous listening:', error);
            }
          }
        }, [voiceMode, currentLanguage]);
        
        // Toggle Voice Mode
        const toggleVoiceMode = async () => {
          const newVoiceMode = !voiceMode;
          setVoiceMode(newVoiceMode);
          
          if (newVoiceMode) {
            const currentLang = indianLanguages[currentLanguage];
            await speak(`Voice mode activated. Say ${currentLang.wakeWords[0]} to get my attention.`);
            setTimeout(() => startContinuousListening(), 3000);
          } else {
            await speak('Voice mode deactivated.');
            setIsAwake(false);
            setIsListening(false);
            
            if (continuousRecognitionRef.current) {
              continuousRecognitionRef.current.stop();
            }
            if (recognitionRef.current) {
              recognitionRef.current.stop();
            }
          }
        };
        
        // Manual Send Function
        const sendMessage = async () => {
          const query = input.trim();
          if (!query) return;
          
          const userMessage = {
            id: Date.now(),
            who: 'You',
            text: query,
            timestamp: new Date()
          };
          
          setMessages(prev => [...prev, userMessage]);
          setInput('');
          setIsProcessing(true);
          
          try {
            const response = await fetch('/ask', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                query: query,
                session_id: sessionId,
                language: currentLanguage,
                voice_mode: false
              })
            });
            
            const data = await response.json();
            const answer = data.answer || 'No answer available.';
            
            const assistantMessage = {
              id: Date.now() + 1,
              who: 'JARVIS',
              text: answer,
              timestamp: new Date(),
              sources: data.sources || []
            };
            
            setMessages(prev => [...prev, assistantMessage]);
            
            if (voiceMode) {
              await speak(answer);
            }
            
          } catch (error) {
            console.error('Message send error:', error);
            
            const errorMessage = {
              id: Date.now() + 1,
              who: 'JARVIS',
              text: 'Connection error. Please check your network and try again.',
              timestamp: new Date(),
              type: 'error'
            };
            
            setMessages(prev => [...prev, errorMessage]);
          } finally {
            setIsProcessing(false);
          }
        };
        
        // Language Change Handler
        const handleLanguageChange = async (newLanguage) => {
          setCurrentLanguage(newLanguage);
          
          if (voiceMode) {
            if (continuousRecognitionRef.current) {
              continuousRecognitionRef.current.stop();
            }
            if (recognitionRef.current) {
              recognitionRef.current.stop();
            }
            
            setTimeout(() => {
              setupSpeechRecognition();
              startContinuousListening();
            }, 1000);
          }
          
          const currentLang = indianLanguages[newLanguage];
          const welcomeMessage = {
            id: Date.now(),
            who: 'JARVIS',
            text: `Language changed to ${currentLang.nativeName}. ${currentLang.greeting}`,
            timestamp: new Date()
          };
          
          setMessages(prev => [...prev, welcomeMessage]);
          
          if (voiceMode) {
            await speak(currentLang.greeting);
          }
        };
        
        // Effects
        useEffect(() => {
          setupSpeechRecognition();
          
          return () => {
            if (recognitionRef.current) recognitionRef.current.stop();
            if (continuousRecognitionRef.current) continuousRecognitionRef.current.stop();
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
          };
        }, [setupSpeechRecognition]);
        
        useEffect(() => {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [messages]);
        
        // Status Indicator
        const getStatusIndicator = () => {
          if (voiceMode) {
            if (isProcessing) return '🟡 Processing...';
            if (isAwake && isListening) return '🟢 Listening...';
            if (isAwake) return '🔵 JARVIS Active';
            return '🟠 Standby Mode';
          }
          if (isProcessing) return '⏳ Processing...';
          return '✅ Ready';
        };
        
        return React.createElement('div', { className: `advanced-voice-assistant ${voiceMode ? 'voice-active' : ''}` },
          // Header
          React.createElement('div', { className: 'assistant-header' },
            React.createElement('div', { className: 'title-section' },
              React.createElement('h1', null, '🤖 JARVIS - DoJ Assistant'),
              React.createElement('div', { className: 'status-bar' },
                React.createElement('span', { className: 'status' }, getStatusIndicator()),
                React.createElement('span', { className: 'language-indicator' }, indianLanguages[currentLanguage].nativeName)
              )
            ),
            React.createElement('div', { className: 'controls-section' },
              React.createElement('button', {
                className: `voice-mode-toggle ${voiceMode ? 'active' : ''}`,
                onClick: toggleVoiceMode,
                disabled: isProcessing
              }, 
                voiceMode ? '🔴' : '🔵',
                React.createElement('span', null, voiceMode ? ' Voice ON' : ' Voice OFF')
              ),
              React.createElement('select', {
                value: currentLanguage,
                onChange: (e) => handleLanguageChange(e.target.value),
                className: 'language-selector',
                disabled: isListening || isProcessing
              }, 
                Object.entries(indianLanguages).map(([code, lang]) =>
                  React.createElement('option', { key: code, value: code }, `${lang.nativeName} (${lang.name})`)
                )
              )
            )
          ),
          
          // Messages Area
          React.createElement('div', { className: 'messages-container' },
            messages.map((message) =>
              React.createElement('div', { key: message.id, className: `message ${message.who.toLowerCase()}` },
                React.createElement('div', { className: 'message-header' },
                  React.createElement('span', { className: 'sender' },
                    message.who === 'JARVIS' ? '🤖 JARVIS' : 
                    message.who === 'System' ? '⚙️ System' : 
                    message.who === 'You' ? '👤 You' : message.who
                  ),
                  React.createElement('span', { className: 'timestamp' }, message.timestamp.toLocaleTimeString())
                ),
                React.createElement('div', { className: 'message-content' },
                  message.text,
                  message.sources && message.sources.length > 0 &&
                  React.createElement('div', { className: 'message-sources' },
                    React.createElement('strong', null, 'Sources: '),
                    message.sources.map(s => s.title).join(', ')
                  )
                )
              )
            ),
            React.createElement('div', { ref: messagesEndRef })
          ),
          
          // Input Area
          React.createElement('div', { className: 'input-section' },
            React.createElement('div', { className: 'input-container' },
              React.createElement('textarea', {
                value: input,
                onChange: (e) => setInput(e.target.value),
                placeholder: `Type your message in ${indianLanguages[currentLanguage].nativeName}...`,
                disabled: isProcessing || (voiceMode && (isListening || isAwake)),
                onKeyDown: (e) => {
                  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    sendMessage();
                  }
                },
                className: 'message-input'
              }),
              React.createElement('div', { className: 'input-controls' },
                React.createElement('button', {
                  onClick: sendMessage,
                  disabled: !input.trim() || isProcessing,
                  className: 'send-button'
                }, isProcessing ? '⏳' : '📤'),
                !voiceMode && React.createElement('button', {
                  onClick: () => {
                    if (recognitionRef.current && !isListening) {
                      setIsListening(true);
                      recognitionRef.current.start();
                    }
                  },
                  disabled: isListening || isProcessing,
                  className: 'voice-input-button'
                }, isListening ? '🔴' : '🎤')
              )
            ),
            voiceMode && React.createElement('div', { className: 'voice-commands-help' },
              React.createElement('p', null,
                React.createElement('strong', null, `Wake Words (${indianLanguages[currentLanguage].nativeName}):`)
              ),
              React.createElement('div', { className: 'wake-words' },
                indianLanguages[currentLanguage].wakeWords.map((word, i) =>
                  React.createElement('span', { key: i, className: 'wake-word' }, `"${word}"`)
                )
              )
            )
          )
        );
      }
      
      // Initialize the Enhanced Voice Assistant
      ReactDOM.createRoot(document.getElementById('root')).render(
        React.createElement(EnhancedVoiceAssistant)
      );
    </script>
  </body>
</html>
